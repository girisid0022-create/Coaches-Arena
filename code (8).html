<style>

            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-font-smoothing: antialiased;
        }

<body class="min-h-screen flex flex-col pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background dark:bg-background border-b border-surface-variant z-50">
<div class="flex items-center justify-between px-container-padding h-16 w-full z-50">
<div class="flex items-center gap-4">
<a aria-label="Go back" class="text-on-surface-variant hover:opacity-80 active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</a>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary" style="font-variation-settings: 'FILL' 1;">sports_basketball</span>
<h1 class="font-headline-md text-headline-md font-bold uppercase tracking-tighter text-on-background">New Player</h1>
</div>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-container-padding pt-6 pb-12 w-full max-w-3xl mx-auto">
<div class="mb-stack-gap-lg">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2">Player Registration</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter the details for the new recruit to add them to your roster.</p>
</div>
<form class="space-y-stack-gap-lg">
<!-- Bento Card: Basic Info -->
<div class="bg-[#1A1A1A] border border-[#333333] rounded-xl p-6 shadow-sm">
<h3 class="font-label-md text-label-md text-secondary mb-4 flex items-center gap-2 uppercase tracking-widest">
<span class="material-symbols-outlined text-[18px]">badge</span> Basic Profile
                </h3>
<div class="space-y-stack-gap-md">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="fullName">Full Name</label>
<input class="w-full input-high-contrast rounded-t-DEFAULT px-4 py-3 font-body-md text-body-md" id="fullName" name="fullName" placeholder="e.g. Michael Jordan" type="text"/>
</div>
<div class="grid grid-cols-2 gap-gutter">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="height">Height</label>
<div class="relative">
<input class="w-full input-high-contrast rounded-t-DEFAULT px-4 py-3 font-body-md text-body-md" id="height" name="height" placeholder="6'6&quot;" type="text"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="weight">Weight</label>
<div class="relative">
<input class="w-full input-high-contrast rounded-t-DEFAULT px-4 py-3 font-body-md text-body-md" id="weight" name="weight" placeholder="216 lbs" type="text"/>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-gutter">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="age">Age</label>
<input class="w-full input-high-contrast rounded-t-DEFAULT px-4 py-3 font-body-md text-body-md" id="age" name="age" placeholder="23" type="number"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="gender">Gender</label>
<select class="w-full input-high-contrast rounded-t-DEFAULT px-4 py-3 font-body-md text-body-md appearance-none" id="gender" name="gender">
<option disabled="" selected="" value="">Select...</option>
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>
</select>
</div>
</div>
</div>
</div>
<!-- Bento Card: Athletic Profile -->
<div class="bg-[#1A1A1A] border border-[#333333] rounded-xl p-6 shadow-sm">
<h3 class="font-label-md text-label-md text-secondary mb-4 flex items-center gap-2 uppercase tracking-widest">
<span class="material-symbols-outlined text-[18px]">fitness_center</span> Athletic Metrics
                </h3>
<div class="space-y-stack-gap-md">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="position">Basketball Position</label>
<select class="w-full input-high-contrast rounded-t-DEFAULT px-4 py-3 font-body-md text-body-md appearance-none" id="position" name="position">
<option disabled="" selected="" value="">Select Primary Position</option>
<option value="pg">Point Guard (PG)</option>
<option value="sg">Shooting Guard (SG)</option>
<option value="sf">Small Forward (SF)</option>
<option value="pf">Power Forward (PF)</option>
<option value="c">Center (C)</option>
</select>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="goal">Training Goal</label>
<select class="w-full input-high-contrast rounded-t-DEFAULT px-4 py-3 font-body-md text-body-md appearance-none" id="goal" name="goal">
<option disabled="" selected="" value="">Select Primary Objective</option>
<option value="lose_fat">Lose Fat</option>
<option value="gain_muscle">Gain Muscle</option>
<option value="maintain">Maintain / Conditioning</option>
</select>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2">Diet Preference</label>
<div class="flex flex-wrap gap-4">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="form-radio text-primary-container focus:ring-primary-container bg-[#262626] border-surface-variant h-5 w-5" name="diet" type="radio" value="veg"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Vegetarian</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<input class="form-radio text-primary-container focus:ring-primary-container bg-[#262626] border-surface-variant h-5 w-5" name="diet" type="radio" value="non-veg"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Non-Vegetarian</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<input class="form-radio text-primary-container focus:ring-primary-container bg-[#262626] border-surface-variant h-5 w-5" name="diet" type="radio" value="both"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Omnivore (Both)</span>
</label>
</div>
</div>
</div>
</div>
<!-- Bento Card: Coach Notes -->
<div class="bg-[#1A1A1A] border border-[#333333] rounded-xl p-6 shadow-sm">
<h3 class="font-label-md text-label-md text-secondary mb-4 flex items-center gap-2 uppercase tracking-widest">
<span class="material-symbols-outlined text-[18px]">edit_note</span> Tactical Assessment
                </h3>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 sr-only" for="notes">Coach Notes</label>
<textarea class="w-full input-high-contrast rounded-t-DEFAULT px-4 py-3 font-body-md text-body-md resize-y" id="notes" name="notes" placeholder="Initial observations, injury history, or specific developmental focuses..." rows="4"></textarea>
</div>
</div>
<div class="pt-4">
<button class="w-full bg-primary-container hover:bg-[#F27D2C] text-black font-label-md text-label-md font-bold uppercase tracking-wider py-4 rounded-lg flex items-center justify-center gap-2 transition-all active:scale-95 btn-glow h-12" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">how_to_reg</span>
                    Register Player
                </button>
</div>
</form>
</main>
<!-- Contextual Nav Suppression: This is a linear/transactional form with a back button. 
         BottomNavBar and SideNav are suppressed as per "Automatic Suppression" rule. -->
</body></html>
